name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      # test_codex_backend.py is excluded: it needs a real on-disk SPINE_REPO checkout
      # (harness_config.use_tree() switches sys.path to a source tree, not the installed
      # package), which this minimal gate deliberately doesn't set up (SSPN-117 chose
      # `pip install synaptixs-spine` over checking out ai/spine as a sibling repo in CI).
      # Tracked as follow-up, not silently dropped.
      - name: Tests
        run: python -m pytest -q tests/test_scenarios.py tests/test_report_usage.py tests/test_wsl_support.py tests/test_jira_benchmark.py tests/test_framework_matrix.py tests/test_matrix_study.py tests/test_spine_feature.py tests/test_context_matrix.py tests/test_portable.py
