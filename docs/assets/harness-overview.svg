<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">Spine Harness four-workflow comparison</title>
  <desc id="desc">For each issue, one frozen repository baseline, model, and set of checks feeds four isolated workflows: Spine with PKG, Spine with integrated OpenSpec and PKG, standalone OpenSpec, and Spec Kit. Repeat for more issues and aggregate compatible results.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b31"/>
      <stop offset="1" stop-color="#172a42"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8da5bf"/>
    </marker>
  </defs>
  <rect width="1120" height="490" rx="24" fill="url(#background)"/>
  <text x="42" y="53" fill="#f3f7fc" font-family="system-ui, sans-serif" font-size="27" font-weight="700">Multiple issues. Four matched workflows for each.</text>
  <text x="42" y="83" fill="#b8c9dc" font-family="system-ui, sans-serif" font-size="16">Freeze the inputs for each issue, compare isolated implementations, then aggregate results.</text>

  <rect x="42" y="113" width="1036" height="77" rx="15" fill="#243950" stroke="#47627d"/>
  <rect x="60" y="130" width="116" height="42" rx="10" fill="#3f6481"/>
  <text x="118" y="157" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">EACH ISSUE</text>
  <text x="199" y="145" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Repository at commit · saved issue · shared model settings</text>
  <text x="199" y="170" fill="#c6d6e7" font-family="system-ui, sans-serif" font-size="15">Baseline regression and independent acceptance checks</text>

  <g fill="none" stroke="#8da5bf" stroke-width="2" marker-end="url(#arrow)">
    <path d="M171 190 V214"/><path d="M430 190 V214"/><path d="M690 190 V214"/><path d="M949 190 V214"/>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="42" y="222" width="244" height="119" rx="15" fill="#183e48" stroke="#49c2bd" stroke-width="2"/>
    <text x="60" y="254" fill="#70e0d4" font-size="15" font-weight="700">01</text>
    <text x="60" y="282" fill="#ffffff" font-size="20" font-weight="700">Spine + PKG</text>
    <text x="60" y="309" fill="#cae7e5" font-size="14">Native Spine, graph-grounded</text>
    <text x="60" y="328" fill="#cae7e5" font-size="14">implementation</text>

    <rect x="306" y="222" width="244" height="119" rx="15" fill="#263d39" stroke="#99d69c" stroke-width="2"/>
    <text x="324" y="254" fill="#b4ebaf" font-size="15" font-weight="700">02</text>
    <text x="324" y="281" fill="#ffffff" font-size="17" font-weight="700">Spine + OpenSpec + PKG</text>
    <text x="324" y="309" fill="#d7e9d6" font-size="14">OpenSpec integrated inside</text>
    <text x="324" y="328" fill="#d7e9d6" font-size="14">Spine's native workflow</text>

    <rect x="570" y="222" width="244" height="119" rx="15" fill="#333353" stroke="#aaa1fa" stroke-width="2"/>
    <text x="588" y="254" fill="#c2baff" font-size="15" font-weight="700">03</text>
    <text x="588" y="282" fill="#ffffff" font-size="20" font-weight="700">OpenSpec</text>
    <text x="588" y="309" fill="#dedbfa" font-size="14">Standalone specification</text>
    <text x="588" y="328" fill="#dedbfa" font-size="14">workflow</text>

    <rect x="834" y="222" width="244" height="119" rx="15" fill="#49392f" stroke="#f2b779" stroke-width="2"/>
    <text x="852" y="254" fill="#ffd19c" font-size="15" font-weight="700">04</text>
    <text x="852" y="282" fill="#ffffff" font-size="20" font-weight="700">Spec Kit</text>
    <text x="852" y="309" fill="#f5dfc8" font-size="14">Standalone specification</text>
    <text x="852" y="328" fill="#f5dfc8" font-size="14">workflow</text>
  </g>

  <g fill="none" stroke="#8da5bf" stroke-width="2" marker-end="url(#arrow)">
    <path d="M171 341 V366"/><path d="M430 341 V366"/><path d="M690 341 V366"/><path d="M949 341 V366"/>
  </g>
  <rect x="42" y="375" width="1036" height="73" rx="15" fill="#253951" stroke="#526f8e"/>
  <text x="62" y="403" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Independent evaluation → per-issue result → multi-issue study</text>
  <text x="62" y="428" fill="#c6d6e7" font-family="system-ui, sans-serif" font-size="15">Acceptance · native status · protected checks · tokens · time · API-equivalent cost</text>
</svg>
